          exact-hit: ${{ steps.rust_cache.outputs.exact-hit }}

  verify:
    name: Bidirectional Driver & Perception Regression Suite
    if: github.event_name == 'pull_request' || inputs.verify_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout base branch for verification runner
        uses: actions/checkout@v5
        with:
          ref: feat/wayland-with-perception-opt
          fetch-depth: 0

      - name: Checkout target PR or commit and mark status pending
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          VERIFY_REF_INPUT: ${{ inputs.verify_ref }}
        run: |
          set -euo pipefail

          cp .github/workflows/verify-fork-driver.sh /tmp/verify-fork-driver.sh
          chmod +x /tmp/verify-fork-driver.sh

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PR_NUMBER=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${PR_HEAD_SHA}"
            git checkout --detach "${PR_HEAD_SHA}"
            TESTED_SHA=$(git rev-parse HEAD)
            PR_NUMBER="${PR_NUMBER_EVENT}"
          else
            git fetch origin "${VERIFY_REF_INPUT}" || true
            if git rev-parse --verify --quiet "origin/${VERIFY_REF_INPUT}^{commit}" >/dev/null; then
              git checkout --detach "origin/${VERIFY_REF_INPUT}"
            else
              git checkout --detach "${VERIFY_REF_INPUT}"
            fi
            TESTED_SHA=$(git rev-parse HEAD)
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=50" \
              --jq ".[] | select(.head.sha == \"${TESTED_SHA}\" or .head.ref == \"${VERIFY_REF_INPUT}\") | .number" \
              | head -n 1 || true)
          fi

          echo "tested_sha=${TESTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Verifying exact commit ${TESTED_SHA} (PR: ${PR_NUMBER:-none})"

          jq -n \
            --arg state "pending" \
            --arg target_url "${RUN_URL}" \
            --arg description "Running 5-layer compile, clippy, unit, Wayland & GTK3 AT-SPI suite..." \
            --arg context "${VERIFY_STATUS_CONTEXT}" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" --input - >/dev/null || true

      - name: Free runner disk space
        uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"

      - name: Install pinned Rust toolchain with rustfmt and clippy
        run: |
          set -euo pipefail
          TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' libs/cua-driver/rust/rust-toolchain.toml)
          TOOLCHAIN="${TOOLCHAIN:-stable}"
          rustup toolchain install "${TOOLCHAIN}" --profile minimal --component rustfmt --component clippy

      - name: Configure Rust sccache
        id: rust_cache
        uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          pr-save: "true"
          save-always: "true"

      - name: Install Linux build and headless desktop dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential cmake clang pkg-config
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxi-dev
            libxtst-dev libxrandr-dev libgtk-3-dev
            xvfb xauth x11-utils xdotool dbus-daemon dbus-x11 at-spi2-core
            libglib2.0-bin libatk-adaptor openbox picom python3-gi gir1.2-gtk-3.0
            imagemagick ffmpeg

      - name: Enable mold fast linker
        run: |
          if timeout 60 sudo apt-get install -y --no-install-recommends mold >/dev/null 2>&1 && command -v mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld
            sudo ln -sf "$(command -v mold)" /usr/bin/ld
            echo "Enabled mold fast linker: $(ld --version | head -n 1)"
          elif command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/local/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            echo "Enabled lld fast linker: $(ld --version | head -n 1)"
          else
            echo "Keeping system default linker: $(ld --version | head -n 1)"
          fi

      - name: Run 5-layer bidirectional verification and publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ steps.target.outputs.tested_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          set +e
          bash /tmp/verify-fork-driver.sh
          VERIFY_RC=$?
          set -e

          if [[ -f /tmp/verify_report.md ]]; then
            cat /tmp/verify_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${VERIFY_RC}" -eq 0 ]]; then
            STATE="success"
            DESC="All 5 layers passed (fmt + clippy + unit + Wayland portal + GTK3 AT-SPI)"
          else
            STATE="failure"
            DESC="Bidirectional regression suite failed (exit ${VERIFY_RC})"
          fi

          jq -n \
            --arg state "${STATE}" \
            --arg target_url "${RUN_URL}" \
            --arg description "${DESC}" \
            --arg context "${VERIFY_STATUS_CONTEXT}" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" --input - >/dev/null || true

          if [[ -n "${PR_NUMBER}" && -f /tmp/verify_report.md ]]; then
            MARKER="<!-- cua-fork-verify-report -->"
            {
              echo "${MARKER}"
              cat /tmp/verify_report.md
              if [[ "${VERIFY_RC}" -ne 0 && -s /tmp/verify_failure.log ]]; then
                echo ""
                echo "<details><summary>展开查看错误日志摘要</summary>"
                echo ""
                echo "\`\`\`text"
                head -n 140 /tmp/verify_failure.log
                echo "\`\`\`"
                echo "</details>"
              fi
              echo ""
              echo "🔗 [查看完整 Actions 运行日志](${RUN_URL})"
            } > /tmp/pr_verify_comment.md

            EXISTING_COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=50" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
            if [[ -n "${EXISTING_COMMENT_ID}" ]]; then
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" --input - >/dev/null || true
            else
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null || true
            fi
          fi

          exit "${VERIFY_RC}"

      - name: Save Rust sccache
        if: always() && steps.rust_cache.outputs.save == 'true'
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          dir: ${{ steps.rust_cache.outputs.dir }}
          exact-hit: ${{ steps.rust_cache.outputs.exact-hit }}
