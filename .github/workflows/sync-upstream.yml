          workspace_snapshot_hash() {
            (
              git status --porcelain 2>/dev/null || true
              git diff 2>/dev/null || true
              git diff --cached 2>/dev/null || true
            ) | sha256sum | awk '{print $1}'
          }

          has_remaining_conflict_markers() {
            local cf
            while IFS= read -r cf; do
              if [[ -n "$cf" && -f "$cf" ]] && grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- "$cf" >/dev/null 2>&1; then
                return 0
              fi
            done <<< "${CONFLICT_FILES:-}"
            return 1
          }

          invoke_agy_with_prompt() {
            local prompt_text="$1"
            local tier="${2:-deep}"
            local expect_edits="${3:-true}"
            ensure_agy_and_vertex_bridge

            local before_hash
            before_hash=$(workspace_snapshot_hash)

            run_once() {
              local tmo="$1"
              shift
              GEMINI_API_KEY="${VERTEX_API_KEY}" \
              GOOGLE_GEMINI_BASE_URL="http://127.0.0.1:${VERTEX_PROXY_PORT}" \
              NO_PROXY="127.0.0.1,localhost" \
              no_proxy="127.0.0.1,localhost" \
              agy -p "${prompt_text}" \
                --settings '{"modelProvider":"gemini"}' \
                --dangerously-skip-permissions \
                --output-format json \
                --print-timeout "${tmo}" \
                "$@" </dev/null >/tmp/agy_stdout.json 2>/tmp/agy_stderr.log
            }

            local -a candidates=()
            if [[ "${tier}" == "fast" ]]; then
              candidates=(
                "gemini-3.8-flash-high|5m"
                "gemini-4-carbon-high|7m"
              )
            else
              candidates=(
                "gemini-4-carbon-high|7m"
                "gemini-4-argon-high|7m"
                "gemini-3.8-flash-high|7m"
              )
            fi

            local agy_rc=1
            local json_status="ERROR"
            local after_hash=""
            local last_err=""
            local idx=0
            local total="${#candidates[@]}"

            set +e
            for entry in "${candidates[@]}"; do
              idx=$((idx + 1))
              local cand_model="${entry%%|*}"
              local cand_tmo="${entry##*|}"
              echo "🤖 [agy:${tier}] (${idx}/${total}) Invoking ${cand_model} (timeout ${cand_tmo})..."

              run_once "${cand_tmo}" --model "${cand_model}"
              agy_rc=$?
              json_status=$(jq -r '.status // "ERROR"' /tmp/agy_stdout.json 2>/dev/null || echo "ERROR")
              after_hash=$(workspace_snapshot_hash)

              if [[ $agy_rc -eq 0 && "${json_status}" == "SUCCESS" ]]; then
                if has_remaining_conflict_markers; then
                  last_err="${cand_model} returned SUCCESS but conflict markers still remain"
                  echo "⚠️ [agy:${cand_model}] ${last_err}; trying next candidate..."
                elif [[ "${expect_edits}" == "true" && "${after_hash}" == "${before_hash}" ]]; then
                  last_err="${cand_model} returned SUCCESS without modifying workspace files"
                  echo "⚠️ [agy:${cand_model}] ${last_err}; trying next candidate..."
                else
                  SUMMARY=$(jq -r '.response // ""' /tmp/agy_stdout.json)
                  echo "✅ [agy:${cand_model}] Completed edits cleanly."
                  set -e
                  return 0
                fi
              elif [[ $agy_rc -eq 3 && "${after_hash}" != "${before_hash}" ]] && ! has_remaining_conflict_markers; then
                echo "⚠️ [agy:${cand_model}] Hit print-timeout (${cand_tmo}) after writing clean workspace edits; proceeding to outer deterministic verification..."
                SUMMARY=$(jq -r '.response // "已完成代码修复（外层流水线继续执行格式化与 5 层测试校验）。"' /tmp/agy_stdout.json 2>/dev/null || echo "已完成代码修复。")
                set -e
                return 0
              else
                last_err=$(jq -r '.error // empty' /tmp/agy_stdout.json 2>/dev/null || true)
                if [[ -z "${last_err}" ]]; then
                  last_err=$(tail -n 6 /tmp/agy_stderr.log 2>/dev/null | tr '\n' ' ' || echo "exit code ${agy_rc}")
                fi
                echo "⚠️ [agy:${cand_model}] Unsuccessful (exit=${agy_rc}, status=${json_status}): ${last_err:0:240}"
              fi

              if [[ $idx -lt $total ]]; then
                sleep 3
              fi
            done
            set -e

            cat /tmp/agy_stderr.log >&2 || true
            notify_failure "agy 候选模型链（${tier}）均未完成有效修复（exit ${agy_rc} / ${json_status}）：${last_err}"
            exit 1
          }

