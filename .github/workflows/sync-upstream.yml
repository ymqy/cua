name: Sync Upstream Main

on:
  schedule:
    # 每 6 小时自动检查并同步一次上游最新提交（避开整点队列高峰）
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      auto_merge_conflict_resolution:
        description: '遇到代码冲突并由 agy 修复后，是否直接合入目标分支（默认 false：提 PR 发通知确认）'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: trycua/cua
  TARGET_BRANCH: feat/wayland-with-perception-opt

jobs:
  sync:
    name: Sync upstream/main into feat/wayland-with-perception-opt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v5
        with:
          ref: feat/wayland-with-perception-opt
          fetch-depth: 0

      - name: Fetch upstream and attempt clean merge
        id: merge_attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "Ming Ye"
          git config user.email "22427967+ymqy@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          # 1. 直接从官方仓库拉取最新 main 提交与当前目标分支
          git fetch upstream main
          git fetch origin "${TARGET_BRANCH}"

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/main)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UPSTREAM_SHORT}" >> "$GITHUB_OUTPUT"

          # 2. 检查目标分支是否已包含最新 upstream/main
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            echo "${TARGET_BRANCH} already contains ${UPSTREAM_SHORT}. Nothing to do."
            exit 0
          fi

          # 3. 检查本仓库（显式指定 repos/${GITHUB_REPOSITORY}，绝不访问上游）是否已有针对该 commit 的待合并 PR
          EXISTING_PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=50" \
            --jq ".[] | select(.head.ref | startswith(\"auto-sync/${UPSTREAM_SHORT}\")) | .html_url" \
            | head -n 1 || true)
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "status=pr_already_open" >> "$GITHUB_OUTPUT"
            echo "An open sync PR already exists for ${UPSTREAM_SHORT}: ${EXISTING_PR}"
            exit 0
          fi

          # 4. 尝试将 upstream/main 合并进目标分支（先不提交，自动剥离上游自带的 workflows）
          git merge --no-commit --no-ff upstream/main || true

          # 自动移除因上游修改/新增 .github/workflows/*.yml 产生的文件或删改冲突，始终只保留 sync-upstream.yml
          while IFS= read -r wf; do
            if [[ -n "$wf" && "$wf" != ".github/workflows/sync-upstream.yml" ]]; then
              git rm -f --ignore-unmatch -- "$wf"
            fi
          done < <(git diff --name-only --diff-filter=U -- '.github/workflows/')

          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -path '.github/workflows/sync-upstream.yml' \
            -exec git rm -f --ignore-unmatch -- {} +

          # 5. 检查是否还剩余真正的代码冲突
          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [[ -z "${UNMERGED}" ]]; then
            git commit -m "Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}"
            git push origin "${TARGET_BRANCH}"
            echo "status=merged_cleanly" >> "$GITHUB_OUTPUT"
            echo "Cleanly merged ${UPSTREAM_SHORT} into ${TARGET_BRANCH}."
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflict_files<<EOF"
              echo "${UNMERGED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Real code conflicts detected:"
            echo "${UNMERGED}"
          fi

      - name: Install agy, resolve conflicts, and notify or merge
        if: steps.merge_attempt.outputs.status == 'conflict'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_CLI_DISABLE_AUTO_UPDATE: "true"
          AUTO_MERGE_INPUT: ${{ inputs.auto_merge_conflict_resolution }}
          AUTO_MERGE_VAR: ${{ vars.AUTO_MERGE_CONFLICTS }}
          UPSTREAM_SHORT: ${{ steps.merge_attempt.outputs.upstream_short }}
          UPSTREAM_SHA: ${{ steps.merge_attempt.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge_attempt.outputs.conflict_files }}
        run: |
          set -euo pipefail

          notify_failure() {
            local reason="$1"
            local title="⚠️ 自动同步冲突需人工检查 (${UPSTREAM_SHORT})"

            # 避免同一提交重复创建告警 Issue
            local existing_issue
            existing_issue=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
              --jq ".[] | select(.title == \"${title}\") | .html_url" | head -n 1 || true)
            if [[ -n "${existing_issue}" ]]; then
              echo "Open alert issue already exists: ${existing_issue}"
              return 0
            fi

            {
              echo "将上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHORT}\` 合并到 \`${TARGET_BRANCH}\` 时检测到代码冲突，且自动修复未完成。"
              echo ""
              echo "**原因**："
              echo "\`\`\`"
              printf '%s\n' "${reason}"
              echo "\`\`\`"
              echo ""
              echo "**冲突文件**："
              echo "\`\`\`"
              printf '%s\n' "${CONFLICT_FILES}"
              echo "\`\`\`"
              echo ""
              echo "**运行日志**：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > /tmp/sync_issue_body.md

            jq -n \
              --arg title "${title}" \
              --rawfile body /tmp/sync_issue_body.md \
              '{title: $title, body: $body}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" --input - >/dev/null || true
          }

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            notify_failure "未配置 GEMINI_API_KEY Secret，请前往 Settings -> Secrets and variables -> Actions 添加。"
            echo "Error: GEMINI_API_KEY secret is not configured." >&2
            exit 1
          fi

          # 1. 安装官方 Antigravity CLI 到 ~/.local/bin/agy
          mkdir -p "$HOME/.local/bin"
          if ! curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- -d "$HOME/.local/bin"; then
            notify_failure "下载或安装 Antigravity CLI (install.sh) 失败。"
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v agy >/dev/null 2>&1; then
            notify_failure "安装完成后未在 PATH 中找到 agy 可执行文件。"
            exit 1
          fi
          echo "Installed Antigravity CLI version: $(agy --version)"

          # 2. 配置 Gemini API Key 直连模式并信任当前工作目录
          mkdir -p "$HOME/.gemini/antigravity-cli"
          jq -n \
            --arg ws "${GITHUB_WORKSPACE}" \
            '{modelProvider: "gemini", trustedWorkspaces: [$ws]}' \
            > "$HOME/.gemini/antigravity-cli/settings.json"

          # 3. 调用 agy 无头模式分析并解决冲突
          {
            echo "当前仓库正处于将 upstream/main (${UPSTREAM_SHORT}) 合并到 ${TARGET_BRANCH} 的合并冲突状态（.git/MERGE_HEAD 存在）。"
            echo "请严格按以下步骤操作："
            echo "1. 运行 git status 查看所有处于未合并冲突状态（UU/AA/DU/UD）的文件；"
            echo "2. 阅读冲突文件的完整上下文，并通过 git log MERGE_HEAD -n 15 -- <冲突文件> 查看官方最新改动意图，同时通过 git log HEAD -n 15 -- <冲突文件> 查看本分支（Linux Wayland 与感知优化）的定制改动意图，谨慎融合双方逻辑，确保语法、类型、括号闭合、函数签名和导入完全正确；"
            echo "3. 严禁恢复 .github/workflows/ 下除 sync-upstream.yml 以外的任何工作流文件；"
            echo "4. 运行 git diff --check 确保没有任何残留冲突标记（<<<<<<<、=======、>>>>>>>）；"
            echo "5. 使用 git add 暂存已解决的冲突文件，并执行 git commit -m \"Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}\" 完成合并提交；"
            echo "6. 用清晰的中文逐个文件简要说明冲突原因以及你的融合解决方式（这段说明将直接写入 PR 描述供仓库维护者审阅）。"
          } > /tmp/agy_prompt.txt
          PROMPT=$(cat /tmp/agy_prompt.txt)

          run_agy() {
            agy -p "$PROMPT" \
              --settings '{"modelProvider":"gemini"}' \
              --dangerously-skip-permissions \
              --output-format json \
              --print-timeout 20m \
              "$@" >/tmp/agy_stdout.json 2>/tmp/agy_stderr.log
          }

          set +e
          run_agy --effort high
          AGY_EXIT=$?
          if [[ $AGY_EXIT -ne 0 ]] && grep -qiE 'NOT_FOUND|not found|PERMISSION_DENIED|RESOURCE_EXHAUSTED|quota|429|model' /tmp/agy_stderr.log /tmp/agy_stdout.json 2>/dev/null; then
            echo "Default model returned access/quota error; retrying with gemini-3.8-flash-high..."
            run_agy --model gemini-3.8-flash-high
            AGY_EXIT=$?
          fi
          set -e

          if [[ $AGY_EXIT -ne 0 ]]; then
            ERR_MSG=$(jq -r '.error // empty' /tmp/agy_stdout.json 2>/dev/null || true)
            if [[ -z "${ERR_MSG}" ]]; then
              ERR_MSG=$(tail -n 20 /tmp/agy_stderr.log 2>/dev/null || echo "exit code ${AGY_EXIT}")
            fi
            cat /tmp/agy_stderr.log >&2 || true
            notify_failure "agy 执行返回非零状态（exit ${AGY_EXIT}）：${ERR_MSG}"
            exit 1
          fi

          STATUS=$(jq -r '.status // "ERROR"' /tmp/agy_stdout.json)
          SUMMARY=$(jq -r '.response // ""' /tmp/agy_stdout.json)

          if [[ "$STATUS" != "SUCCESS" ]]; then
            ERR_MSG=$(jq -r '.error // "unknown error"' /tmp/agy_stdout.json)
            notify_failure "agy 返回状态 ${STATUS}：${ERR_MSG}"
            exit 1
          fi

          # 4. 兜底复核：检查冲突文件是否仍有冲突标记、剥离上游 workflows、必要时补交合并提交
          MARKER_FOUND=""
          while IFS= read -r cf; do
            if [[ -n "$cf" && -f "$cf" ]] && grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- "$cf" >/dev/null 2>&1; then
              MARKER_FOUND="${MARKER_FOUND}${cf} "
            fi
          done <<< "${CONFLICT_FILES}"

          if [[ -n "${MARKER_FOUND}" ]]; then
            notify_failure "agy 运行结束但以下文件仍残留冲突标记：${MARKER_FOUND}"
            exit 1
          fi

          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -path '.github/workflows/sync-upstream.yml' \
            -exec git rm -f --ignore-unmatch -- {} +

          if [[ -f .git/MERGE_HEAD ]]; then
            while IFS= read -r cf; do
              if [[ -n "$cf" && -e "$cf" ]]; then
                git add -- "$cf"
              fi
            done <<< "${CONFLICT_FILES}"
            if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
              git commit -m "Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}"
            fi
          elif ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if [[ -f .git/MERGE_HEAD ]] || [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            notify_failure "agy 运行结束但仍存在未完成提交的合并状态。"
            exit 1
          fi

          # 5. 根据开关决定直接合入目标分支，还是在本仓库创建 PR 发通知确认
          RESULT_REF=""
          if [[ "${AUTO_MERGE_INPUT}" == "true" || "${AUTO_MERGE_VAR}" == "true" ]]; then
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            echo "Auto-merged resolved conflicts directly into ${TARGET_BRANCH}!"
            RESULT_REF="已直接自动合并至 \`${TARGET_BRANCH}\`"
          else
            PR_BRANCH="auto-sync/${UPSTREAM_SHORT}-$(date -u +%Y%m%d-%H%M)"
            git push -u origin "HEAD:refs/heads/${PR_BRANCH}"

            {
              echo "## 🤖 自动同步冲突修复报告"
              echo ""
              echo "上游仓库 \`${UPSTREAM_REPO}\` 的 \`main\` 分支更新至 \`${UPSTREAM_SHA}\`，合并到 \`${TARGET_BRANCH}\` 时出现以下文件冲突，已由 **Antigravity CLI (\`agy\`)** 自动分析并解决："
              echo ""
              echo "### 冲突文件列表"
              echo "\`\`\`"
              echo "${CONFLICT_FILES}"
              echo "\`\`\`"
              echo ""
              echo "### AI 解决说明"
              printf '%s\n' "${SUMMARY}"
              echo ""
              echo "---"
              echo "> 确认代码改动无误后，直接点击下方 **Merge pull request** 即可合入 \`${TARGET_BRANCH}\`。"
              echo "> *(后续若希望跳过人工确认直接自动合入，只需将仓库 \`Settings -> Secrets and variables -> Actions -> Variables\` 中的 \`AUTO_MERGE_CONFLICTS\` 改为 \`true\` 即可。)*"
            } > /tmp/pr_body.md

            PR_URL=$(jq -n \
              --arg title "chore(sync): 合并上游 main (${UPSTREAM_SHORT}) 并解决冲突" \
              --arg head "${PR_BRANCH}" \
              --arg base "${TARGET_BRANCH}" \
              --rawfile body /tmp/pr_body.md \
              '{title: $title, head: $head, base: $base, body: $body}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" --input - --jq '.html_url')
            echo "Created conflict-resolution PR: ${PR_URL}"
            RESULT_REF="已自动创建冲突解决 PR：${PR_URL}"
          fi

          # 6. 若之前有自动同步告警 Issue，成功后自动评论并关闭
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
            --jq '.[] | select(.title | startswith("⚠️ 自动同步冲突需人工检查")) | .number' \
            | while IFS= read -r inum; do
                if [[ -n "$inum" ]]; then
                  jq -n --arg body "✅ 最新同步运行已完成处理（${RESULT_REF}），自动关闭此告警。" '{body: $body}' \
                    | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${inum}/comments" --input - >/dev/null || true
                  printf '{"state":"closed"}' \
                    | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${inum}" --input - >/dev/null || true
                fi
              done || true
