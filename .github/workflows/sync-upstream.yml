name: Sync Upstream Main

on:
  schedule:
    # 每 6 小时自动检查并同步一次上游最新提交（避开整点队列高峰）
    - cron: '17 */6 * * *'
  pull_request:
    branches:
      - feat/wayland-with-perception-opt
  workflow_dispatch:
    inputs:
      auto_merge_conflict_resolution:
        description: '遇到冲突或测试修复并由 agy 通过全量测试后，是否直接合入目标分支（默认 false：提 PR 确认）'
        required: false
        default: false
        type: boolean
      verify_ref:
        description: '仅针对指定分支或 Commit SHA 运行只读双向回归测试（留空则执行自动同步与自动修复闭环）'
        required: false
        default: ''
        type: string

concurrency:
  group: sync-upstream-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (inputs.verify_ref != '' && format('verify-{0}', inputs.verify_ref)) || 'sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

env:
  UPSTREAM_REPO: trycua/cua
  TARGET_BRANCH: feat/wayland-with-perception-opt
  VERIFY_STATUS_CONTEXT: verify/driver-wayland-perception
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  sync:
    name: Sync upstream/main with Closed-Loop Auto-Heal & Verification
    if: github.event_name != 'pull_request' && inputs.verify_ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v5
        with:
          ref: feat/wayland-with-perception-opt
          fetch-depth: 0

      - name: Fetch upstream and prepare sync or PR self-heal state
        id: merge_attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "Ming Ye"
          git config user.email "22427967+ymqy@users.noreply.github.com"

          cp .github/workflows/verify-fork-driver.sh /tmp/verify-fork-driver.sh
          chmod +x /tmp/verify-fork-driver.sh

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          # 1. 拉取官方最新 main 与当前目标分支
          git fetch upstream main
          git fetch origin "${TARGET_BRANCH}"

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/main)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UPSTREAM_SHORT}" >> "$GITHUB_OUTPUT"

          # 2. 检查目标分支是否已包含最新 upstream/main（无更新时 ~5s 极速退出）
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            echo "${TARGET_BRANCH} already contains ${UPSTREAM_SHORT}. Nothing to do."
            exit 0
          fi

          # 3. 检查本仓库是否已有针对当前最新上游 commit 的待合并 auto-sync PR：
          #    - 若已通过 5 层测试（status == success），极速退出等待人工合并；
          #    - 若尚未通过测试（failure / pending / none），检出该 PR 分支进入 AI 自愈闭环。
          EXISTING_PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=50" \
            --jq "[.[] | select(.head.ref | startswith(\"auto-sync/${UPSTREAM_SHORT}\"))][0] // empty" || true)
          if [[ -n "${EXISTING_PR_JSON}" ]]; then
            EXISTING_PR_NUM=$(jq -r '.number' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_URL=$(jq -r '.html_url' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_REF=$(jq -r '.head.ref' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_SHA=$(jq -r '.head.sha' <<<"${EXISTING_PR_JSON}")

            VERIFIED_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXISTING_PR_SHA}/status" \
              --jq "[.statuses[] | select(.context == \"${VERIFY_STATUS_CONTEXT}\")][0].state // \"none\"" || echo "none")

            if [[ "${VERIFIED_STATE}" == "success" ]]; then
              echo "status=pr_already_open" >> "$GITHUB_OUTPUT"
              echo "Open sync PR #${EXISTING_PR_NUM} (${EXISTING_PR_URL}) already passed all verification checks. Waiting for review."
              exit 0
            fi

            echo "Open sync PR #${EXISTING_PR_NUM} (${EXISTING_PR_REF}) has verification state '${VERIFIED_STATE}'; checking out for closed-loop auto-healing..."
            git fetch origin "${EXISTING_PR_REF}"
            git checkout -B "${EXISTING_PR_REF}" "origin/${EXISTING_PR_REF}"
            {
              echo "status=heal_existing_pr"
              echo "existing_pr_num=${EXISTING_PR_NUM}"
              echo "existing_pr_ref=${EXISTING_PR_REF}"
              echo "existing_pr_url=${EXISTING_PR_URL}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. 尝试将 upstream/main 合并进目标分支（绝不直接推送！即使无文本冲突也必须先通过 5 层测试）
          git merge --no-commit --no-ff upstream/main || true

          while IFS= read -r wf; do
            if [[ -n "$wf" && "$wf" != ".github/workflows/sync-upstream.yml" && "$wf" != ".github/workflows/verify-fork-driver.sh" ]]; then
              git rm -f --ignore-unmatch -- "$wf"
            fi
          done < <(git diff --name-only --diff-filter=U -- '.github/workflows/')

          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -path '.github/workflows/sync-upstream.yml' \
            -exec git rm -f --ignore-unmatch -- {} +

          # 5. 检查是否存在 Git 文本冲突
          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [[ -z "${UNMERGED}" ]]; then
            git commit -m "Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}"
            echo "status=merged_cleanly" >> "$GITHUB_OUTPUT"
            echo "Cleanly merged ${UPSTREAM_SHORT} locally; entering 5-layer verification & auto-heal loop."
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflict_files<<EOF"
              echo "${UNMERGED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Real Git conflicts detected:"
            echo "${UNMERGED}"
          fi

      - name: Free runner disk space
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"

      - name: Install pinned Rust toolchain with rustfmt and clippy
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        run: |
          set -euo pipefail
          TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' libs/cua-driver/rust/rust-toolchain.toml)
          TOOLCHAIN="${TOOLCHAIN:-stable}"
          echo "Installing Rust toolchain ${TOOLCHAIN} (rustfmt + clippy)..."
          rustup toolchain install "${TOOLCHAIN}" --profile minimal --component rustfmt --component clippy

      - name: Configure Rust sccache
        id: rust_cache
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          pr-save: "true"
          save-always: "true"

      - name: Install Linux build and headless desktop dependencies
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential cmake clang pkg-config
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxi-dev
            libxtst-dev libxrandr-dev libgtk-3-dev
            xvfb xauth x11-utils xdotool dbus-daemon dbus-x11 at-spi2-core
            libglib2.0-bin libatk-adaptor openbox picom python3-gi gir1.2-gtk-3.0
            imagemagick ffmpeg

      - name: Enable mold fast linker
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        run: |
          if timeout 60 sudo apt-get install -y --no-install-recommends mold >/dev/null 2>&1 && command -v mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld
            sudo ln -sf "$(command -v mold)" /usr/bin/ld
            echo "Enabled mold fast linker: $(ld --version | head -n 1)"
          elif command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/local/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            echo "Enabled lld fast linker: $(ld --version | head -n 1)"
          else
            echo "Keeping system default linker: $(ld --version | head -n 1)"
          fi

      - name: Closed-loop conflict resolution, 5-layer test verification, AI self-healing, and publish
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_CLI_DISABLE_AUTO_UPDATE: "true"
          AUTO_MERGE_INPUT: ${{ inputs.auto_merge_conflict_resolution }}
          AUTO_MERGE_VAR: ${{ vars.AUTO_MERGE_CONFLICTS }}
          MERGE_STATUS: ${{ steps.merge_attempt.outputs.status }}
          UPSTREAM_SHORT: ${{ steps.merge_attempt.outputs.upstream_short }}
          UPSTREAM_SHA: ${{ steps.merge_attempt.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge_attempt.outputs.conflict_files }}
          EXISTING_PR_NUM: ${{ steps.merge_attempt.outputs.existing_pr_num }}
          EXISTING_PR_REF: ${{ steps.merge_attempt.outputs.existing_pr_ref }}
          EXISTING_PR_URL: ${{ steps.merge_attempt.outputs.existing_pr_url }}
        run: |
          set -euo pipefail

          MAX_REPAIR_ROUNDS=8
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          VERTEX_PROXY_PID=""
          VERTEX_PROXY_PORT=""
          SUMMARY=""
          AI_LOG_SECTIONS=""

          cleanup() {
            if [[ -n "${VERTEX_PROXY_PID}" ]]; then
              kill "${VERTEX_PROXY_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          post_commit_status() {
            local sha="$1"
            local state="$2"
            local desc="$3"
            jq -n \
              --arg state "${state}" \
              --arg target_url "${RUN_URL}" \
              --arg description "${desc:0:138}" \
              --arg context "${VERIFY_STATUS_CONTEXT}" \
              '{state: $state, target_url: $target_url, description: $description, context: $context}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" --input - >/dev/null || true
          }

          upsert_pr_verify_comment() {
            local pr_num="$1"
            local extra_notes="${2:-}"
            local marker="<!-- cua-fork-verify-report -->"
            {
              echo "${marker}"
              if [[ -n "${extra_notes}" ]]; then
                echo "### 🛠️ 自动测试自愈记录"
                printf '%s\n\n' "${extra_notes}"
              fi
              cat /tmp/verify_report.md
              echo ""
              echo "🔗 [查看完整 Actions 运行日志](${RUN_URL})"
            } > /tmp/pr_verify_comment.md

            local existing_cid
            existing_cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/comments?per_page=50" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)
            if [[ -n "${existing_cid}" ]]; then
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_cid}" --input - >/dev/null || true
            else
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/comments" --input - >/dev/null || true
            fi
          }

          close_superseded_sync_prs() {
            local keep_branch="$1"
            local replacement_desc="$2"
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=50" \
              --jq ".[] | select((.head.ref | startswith(\"auto-sync/\")) and (.head.ref != \"${keep_branch}\")) | \"\(.number) \(.head.ref)\"" \
              | while read -r old_num old_ref; do
                  if [[ -n "${old_num}" ]]; then
                    jq -n --arg body "🔄 上游已有更新且新同步结果已通过全部 5 层双向回归测试（${replacement_desc}），自动关闭此旧同步 PR 并清理分支 \`${old_ref}\`。" \
                      '{body: $body}' \
                      | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${old_num}/comments" --input - >/dev/null || true
                    printf '{"state":"closed"}' \
                      | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${old_num}" --input - >/dev/null || true
                    git push origin --delete "${old_ref}" >/dev/null 2>&1 || true
                  fi
                done || true
          }

          close_stale_alert_issues() {
            local msg="$1"
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
              --jq '.[] | select(.title | startswith("⚠️ 自动同步")) | .number' \
              | while IFS= read -r inum; do
                  if [[ -n "$inum" ]]; then
                    jq -n --arg body "✅ 最新自动同步闭环已完成修复并通过全部 5 层双向回归测试（${msg}），自动关闭此告警。" '{body: $body}' \
                      | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${inum}/comments" --input - >/dev/null || true
                    printf '{"state":"closed"}' \
                      | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${inum}" --input - >/dev/null || true
                  fi
                done || true
          }

          notify_failure() {
            local reason="$1"
            local title="⚠️ 自动同步冲突或测试未通过需人工检查"

            {
              echo "将上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHORT}\` 同步到 \`${TARGET_BRANCH}\` 时，自动闭环（最多 ${MAX_REPAIR_ROUNDS} 轮编译/测试自愈）未能完全修复所有问题，**已拦截推送以保护目标分支**。"
              echo ""
              echo "**失败原因**："
              echo "\`\`\`"
              printf '%s\n' "${reason}"
              echo "\`\`\`"
              if [[ -n "${CONFLICT_FILES:-}" ]]; then
                echo ""
                echo "**Git 冲突文件**："
                echo "\`\`\`"
                printf '%s\n' "${CONFLICT_FILES}"
                echo "\`\`\`"
              fi
              if [[ -s /tmp/verify_failure.log ]]; then
                echo ""
                echo "**最后一次编译 / 测试错误摘要**："
                echo "\`\`\`text"
                head -n 140 /tmp/verify_failure.log
                echo "\`\`\`"
              fi
              echo ""
              echo "**完整运行日志**：${RUN_URL}"
            } > /tmp/sync_issue_body.md

            local existing_num
            existing_num=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
              --jq '.[] | select(.title | startswith("⚠️ 自动同步")) | .number' | head -n 1 || true)
            if [[ -n "${existing_num}" ]]; then
              jq -n --rawfile body /tmp/sync_issue_body.md '{body: $body}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${existing_num}/comments" --input - >/dev/null || true
              echo "Updated existing alert issue #${existing_num}."
              return 0
            fi

            jq -n \
              --arg title "${title}" \
              --rawfile body /tmp/sync_issue_body.md \
              '{title: $title, body: $body}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" --input - >/dev/null || true
          }

          ensure_agy_and_vertex_bridge() {
            if [[ -n "${VERTEX_PROXY_PORT}" ]]; then
              return 0
            fi

            if [[ -z "${VERTEX_API_KEY:-}" ]]; then
              notify_failure "未配置 VERTEX_API_KEY Secret，无法启动 agy 自动修复冲突或测试失败。"
              exit 1
            fi

            mkdir -p "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            if ! command -v agy >/dev/null 2>&1; then
              if ! curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- -d "$HOME/.local/bin"; then
                notify_failure "下载或安装 Antigravity CLI (install.sh) 失败。"
                exit 1
              fi
            fi
            if ! command -v agy >/dev/null 2>&1; then
              notify_failure "安装完成后未在 PATH 中找到 agy 可执行文件。"
              exit 1
            fi
            echo "Using Antigravity CLI: $(agy --version)"

            cat <<'PY' > /tmp/vertex_proxy.py
          #!/usr/bin/env python3
          import http.server
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.error
          import urllib.request

          API_KEY = os.environ["VERTEX_API_KEY"]
          EXPLICIT_PROJECT = os.environ.get("VERTEX_PROJECT_ID", "").strip()
          EXPLICIT_LOCATION = os.environ.get("VERTEX_LOCATION", "").strip() or "global"

          _lock = threading.Lock()
          _discovered_project = ""

          PATH_RE = re.compile(r"^/v1(?:beta1?)?/models/([^/:?]+):([^?]+)(?:\?(.*))?$")
          PROJ_ERR_RE = re.compile(r"projects/([^/`\"'\s]+)/locations/")
          EFFORT_SUFFIX_RE = re.compile(r"^(.+)-(low|medium|high)$")
          BACKOFF_SECS = (3, 7, 15)


          def build_vertex_url(model: str, action: str, query: str, project: str, location: str) -> str:
              if project and location and location != "global":
                  base = f"https://{location}-aiplatform.googleapis.com"
              else:
                  base = "https://aiplatform.googleapis.com"

              if project:
                  loc = location or "global"
                  path = f"/v1beta1/projects/{project}/locations/{loc}/publishers/google/models/{model}:{action}"
              else:
                  path = f"/v1beta1/publishers/google/models/{model}:{action}"

              return f"{base}{path}?{query}" if query else f"{base}{path}"


          def sanitize_payload_for_model(model: str, action: str, raw_body: bytes, forced_level: str = "") -> bytes:
              if action not in ("generateContent", "streamGenerateContent"):
                  return raw_body
              try:
                  payload = json.loads(raw_body)
              except Exception:
                  return raw_body
              if not isinstance(payload, dict):
                  return raw_body

              changed = False
              is_gemini4 = model.startswith("gemini-4")

              if is_gemini4:
                  for k in ("cachedContent", "cached_content"):
                      if k in payload:
                          payload.pop(k, None)
                          changed = True

              gen_cfg = payload.get("generationConfig")
              if forced_level and not isinstance(gen_cfg, dict):
                  gen_cfg = {}
                  payload["generationConfig"] = gen_cfg
                  changed = True

              if isinstance(gen_cfg, dict):
                  if is_gemini4:
                      for k in (
                          "temperature", "topP", "topK", "top_p", "top_k",
                          "frequencyPenalty", "presencePenalty", "frequency_penalty", "presence_penalty",
                      ):
                          if k in gen_cfg:
                              gen_cfg.pop(k, None)
                              changed = True
                      for ck in ("candidateCount", "candidate_count"):
                          if ck in gen_cfg and isinstance(gen_cfg[ck], int) and gen_cfg[ck] > 1:
                              gen_cfg[ck] = 1
                              changed = True

                  think_cfg = gen_cfg.get("thinkingConfig")
                  if forced_level and not isinstance(think_cfg, dict):
                      think_cfg = {"thinkingLevel": forced_level}
                      gen_cfg["thinkingConfig"] = think_cfg
                      changed = True
                  elif isinstance(think_cfg, dict):
                      has_budget = "thinkingBudget" in think_cfg or "thinking_budget" in think_cfg
                      if is_gemini4 and has_budget:
                          b1 = think_cfg.pop("thinkingBudget", None)
                          b2 = think_cfg.pop("thinking_budget", None)
                          budget = b1 if isinstance(b1, int) else (b2 if isinstance(b2, int) else -1)
                          if "thinkingLevel" not in think_cfg and "thinking_level" not in think_cfg:
                              think_cfg["thinkingLevel"] = forced_level or ("HIGH" if (budget < 0 or budget >= 4096) else "MEDIUM")
                          changed = True
                      if forced_level and "thinkingLevel" not in think_cfg and "thinking_level" not in think_cfg:
                          think_cfg["thinkingLevel"] = forced_level
                          changed = True
                      if is_gemini4:
                          for lk in ("thinkingLevel", "thinking_level"):
                              if think_cfg.get(lk) == "MINIMAL":
                                  think_cfg[lk] = "LOW"
                                  changed = True

              return json.dumps(payload).encode("utf-8") if changed else raw_body


          def strip_legacy_thinking_budget(raw_body: bytes):
              try:
                  payload = json.loads(raw_body)
              except Exception:
                  return None
              gen_cfg = payload.get("generationConfig")
              if not isinstance(gen_cfg, dict):
                  return None
              think_cfg = gen_cfg.get("thinkingConfig")
              if not isinstance(think_cfg, dict) or ("thinkingBudget" not in think_cfg and "thinking_budget" not in think_cfg):
                  return None
              b1 = think_cfg.pop("thinkingBudget", None)
              b2 = think_cfg.pop("thinking_budget", None)
              budget = b1 if isinstance(b1, int) else (b2 if isinstance(b2, int) else -1)
              if "thinkingLevel" not in think_cfg and "thinking_level" not in think_cfg:
                  think_cfg["thinkingLevel"] = "HIGH" if (budget < 0 or budget >= 4096) else "LOW"
              return json.dumps(payload).encode("utf-8")


          class VertexBridgeHandler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  pass

              def _send_error_json(self, code: int, body: bytes):
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.close_connection = True
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  global _discovered_project
                  m = PATH_RE.match(self.path)
                  if not m:
                      msg = json.dumps({"error": {"code": 404, "message": f"Unsupported path: {self.path}"}}).encode()
                      self._send_error_json(404, msg)
                      return

                  raw_model, action, query = m.group(1), m.group(2), m.group(3) or ""
                  forced_level = ""
                  em = EFFORT_SUFFIX_RE.match(raw_model)
                  if em:
                      model = em.group(1)
                      forced_level = em.group(2).upper()
                  else:
                      model = raw_model

                  length = int(self.headers.get("Content-Length", 0))
                  raw_body = self.rfile.read(length)
                  body = sanitize_payload_for_model(model, action, raw_body, forced_level)

                  with _lock:
                      project = EXPLICIT_PROJECT or _discovered_project
                  location = EXPLICIT_LOCATION if EXPLICIT_PROJECT else "global"

                  headers = {
                      "Content-Type": self.headers.get("Content-Type", "application/json"),
                      "x-goog-api-key": API_KEY,
                  }
                  if "Accept" in self.headers:
                      headers["Accept"] = self.headers["Accept"]

                  retry_idx = 0
                  timeout_retried = False
                  for _attempt in range(7):
                      url = build_vertex_url(model, action, query, project, location)
                      req = urllib.request.Request(url, data=body, headers=headers, method="POST")
                      t0 = time.monotonic()
                      try:
                          with urllib.request.urlopen(req, timeout=240) as resp:
                              sys.stderr.write(f"[vertex_proxy] {model}:{action} -> HTTP {resp.status} (ttfb {time.monotonic() - t0:.1f}s)\n")
                              sys.stderr.flush()
                              self.send_response(resp.status)
                              ctype = resp.headers.get("Content-Type", "application/json")
                              self.send_header("Content-Type", ctype)
                              self.close_connection = True
                              self.end_headers()
                              while True:
                                  chunk = resp.read1(4096) if hasattr(resp, "read1") else resp.read(4096)
                                  if not chunk:
                                      break
                                  self.wfile.write(chunk)
                                  self.wfile.flush()
                              return
                      except urllib.error.HTTPError as e:
                          err_body = e.read()
                          err_text = err_body.decode("utf-8", "replace").replace(API_KEY, "***")
                          if e.code == 404 and not project:
                              pm = PROJ_ERR_RE.search(err_text)
                              if pm:
                                  project = pm.group(1)
                                  location = "global"
                                  with _lock:
                                      _discovered_project = project
                                  continue
                          if e.code == 400 and ("thinking_budget" in err_text or "thinkingBudget" in err_text):
                              patched = strip_legacy_thinking_budget(body)
                              if patched is not None:
                                  body = patched
                                  continue
                          if e.code in (429, 500, 502, 503, 504) and retry_idx < len(BACKOFF_SECS):
                              wait_s = BACKOFF_SECS[retry_idx]
                              retry_idx += 1
                              sys.stderr.write(f"[vertex_proxy] HTTP {e.code} on {model}:{action}; sleeping {wait_s}s before retry {retry_idx}...\n")
                              sys.stderr.flush()
                              time.sleep(wait_s)
                              continue
                          one_line = " ".join(err_text.split())[:220]
                          sys.stderr.write(f"[vertex_proxy] HTTP {e.code} on {model}:{action}: {one_line}\n")
                          sys.stderr.flush()
                          self._send_error_json(e.code, err_body)
                          return
                      except TimeoutError as e:
                          if not timeout_retried:
                              timeout_retried = True
                              sys.stderr.write(f"[vertex_proxy] Socket timeout on {model}:{action}; retrying once...\n")
                              sys.stderr.flush()
                              continue
                          msg = json.dumps({"error": {"code": 504, "message": f"Vertex proxy timeout: {e}"}}).encode()
                          self._send_error_json(504, msg)
                          return
                      except Exception as e:
                          if retry_idx < len(BACKOFF_SECS):
                              wait_s = BACKOFF_SECS[retry_idx]
                              retry_idx += 1
                              time.sleep(wait_s)
                              continue
                          msg = json.dumps({"error": {"code": 502, "message": f"Vertex proxy upstream error: {e}"}}).encode()
                          self._send_error_json(502, msg)
                          return


          def main():
