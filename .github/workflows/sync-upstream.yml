name: Sync Upstream Main

on:
  schedule:
    # 每 6 小时自动检查并同步一次上游最新提交（避开整点队列高峰）
    - cron: '17 */6 * * *'
  push:
    branches:
      - feat/wayland-with-perception-opt
    paths:
      - 'libs/cua-driver/rust/**'
  pull_request:
    branches:
      - feat/wayland-with-perception-opt
    paths-ignore:
      - '.github/workflows/verify-sync-infra.yml'
      - '.github/workflows/test_sync_infra.py'
  workflow_dispatch:
    inputs:
      auto_merge_conflict_resolution:
        description: '遇到冲突或测试修复并由 agy 通过全量测试后，是否直接合入目标分支（默认 false：提 PR 确认）'
        required: false
        default: false
        type: boolean
      verify_ref:
        description: '仅针对指定分支或 Commit SHA 运行只读双向回归测试（留空则执行自动同步与自动修复闭环）'
        required: false
        default: ''
        type: string

concurrency:
  group: sync-upstream-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('push-{0}', github.ref_name)) || (inputs.verify_ref != '' && format('verify-{0}', inputs.verify_ref)) || 'sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

env:
  UPSTREAM_REPO: trycua/cua
  TARGET_BRANCH: feat/wayland-with-perception-opt
  VERIFY_STATUS_CONTEXT: verify/driver-wayland-perception
  SYNC_BIN_DIR: /tmp/cua-sync-bin
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  sync:
    name: Sync upstream/main with Closed-Loop Auto-Heal & Verification
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verify_ref == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v5
        with:
          ref: feat/wayland-with-perception-opt
          fetch-depth: 0

      - name: Fetch upstream and prepare sync or PR self-heal state
        id: merge_attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git config user.name "Ming Ye"
          git config user.email "22427967+ymqy@users.noreply.github.com"

          # Stage fork sync scripts into /tmp BEFORE git checkout/merge so branch switches
          # or upstream conflicts can never alter the running scripts mid-flight.
          # shellcheck source=.github/workflows/agy-sync-lib.sh
          source .github/workflows/agy-sync-lib.sh
          stage_sync_scripts_to_dir "${SYNC_BIN_DIR}"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          # 1. 拉取官方最新 main 与当前目标分支
          git fetch upstream main
          git fetch origin "${TARGET_BRANCH}"

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/main)
          TARGET_SHA=$(git rev-parse "origin/${TARGET_BRANCH}")
          TARGET_SHORT=$(git rev-parse --short "origin/${TARGET_BRANCH}")
          {
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "upstream_short=${UPSTREAM_SHORT}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"

          # 2. 检查目标分支是否已包含最新 upstream/main（无更新时 ~5s 极速退出）
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            echo "${TARGET_BRANCH} already contains ${UPSTREAM_SHORT}. Nothing to do."
            exit 0
          fi

          OPEN_ALERT_BODIES=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
            --jq '[.[] | select(.title | startswith("⚠️ 自动同步")) | .body // ""] | join("\n")' 2>/dev/null || true)

          # 3. 检查本仓库是否已有针对当前最新上游 commit 的待合并或检查点 auto-sync PR
          EXISTING_PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=50" \
            --jq "[.[] | select(.head.ref | startswith(\"auto-sync/${UPSTREAM_SHORT}\"))][0] // empty" || true)
          if [[ -n "${EXISTING_PR_JSON}" ]]; then
            EXISTING_PR_NUM=$(jq -r '.number' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_URL=$(jq -r '.html_url' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_REF=$(jq -r '.head.ref' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_SHA=$(jq -r '.head.sha' <<<"${EXISTING_PR_JSON}")
            EXISTING_PR_DRAFT=$(jq -r '.draft // false' <<<"${EXISTING_PR_JSON}")

            VERIFIED_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXISTING_PR_SHA}/status" \
              --jq "[.statuses[] | select(.context == \"${VERIFY_STATUS_CONTEXT}\")][0].state // \"none\"" || echo "none")

            if [[ "${VERIFIED_STATE}" == "success" ]]; then
              echo "status=pr_already_open" >> "$GITHUB_OUTPUT"
              echo "Open sync PR #${EXISTING_PR_NUM} (${EXISTING_PR_URL}) already passed all verification checks. Waiting for review."
              exit 0
            fi

            if should_skip_exhausted_schedule "${EVENT_NAME}" "${OPEN_ALERT_BODIES}" "${UPSTREAM_SHA}" "${EXISTING_PR_SHA}"; then
              echo "status=already_attempted_failed" >> "$GITHUB_OUTPUT"
              echo "Scheduled run skipped: checkpoint PR #${EXISTING_PR_NUM} (${EXISTING_PR_SHA:0:8}) for upstream ${UPSTREAM_SHORT} already exhausted auto-heal. Push a commit or trigger workflow_dispatch to retry."
              exit 0
            fi

            echo "Open sync PR #${EXISTING_PR_NUM} (${EXISTING_PR_REF}, draft=${EXISTING_PR_DRAFT}) has state '${VERIFIED_STATE}'; checking out for closed-loop auto-healing..."
            git fetch origin "${EXISTING_PR_REF}"
            git checkout -B "${EXISTING_PR_REF}" "origin/${EXISTING_PR_REF}"
            {
              echo "status=heal_existing_pr"
              echo "existing_pr_num=${EXISTING_PR_NUM}"
              echo "existing_pr_ref=${EXISTING_PR_REF}"
              echo "existing_pr_url=${EXISTING_PR_URL}"
              echo "existing_pr_draft=${EXISTING_PR_DRAFT}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. 定时触发幂等熔断：若完全相同的 (upstream_sha, target_sha) 已耗尽自动修复，跳过重复空烧
          if should_skip_exhausted_schedule "${EVENT_NAME}" "${OPEN_ALERT_BODIES}" "${UPSTREAM_SHA}" "${TARGET_SHA}"; then
            echo "status=already_attempted_failed" >> "$GITHUB_OUTPUT"
            echo "Scheduled run skipped: pair ${UPSTREAM_SHORT}:${TARGET_SHORT} already exhausted auto-heal. Waiting for new commits or manual workflow_dispatch."
            exit 0
          fi

          # 5. 尝试将 upstream/main 合并进目标分支（绝不直接推送！即使无文本冲突也必须先通过 5 层测试）
          git merge --no-commit --no-ff upstream/main || true

          # 保护本分叉专有工作流文件，移除上游其它工作流；并对 Cargo.lock 冲突做确定性自动解冲
          prune_upstream_workflows
          auto_resolve_lockfile_conflicts

          # 6. 检查是否仍存在真实源码/配置冲突
          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [[ -z "${UNMERGED}" ]]; then
            git commit -m "Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}"
            echo "status=merged_cleanly" >> "$GITHUB_OUTPUT"
            echo "Cleanly merged ${UPSTREAM_SHORT} locally; entering 5-layer verification & auto-heal loop."
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflict_files<<EOF"
              echo "${UNMERGED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Real Git conflicts detected:"
            echo "${UNMERGED}"
          fi

      - name: Fail-fast preflight of agy CLI & dual-model Vertex access (Argon + 3.8 Flash)
        if: contains(fromJSON('["conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${SYNC_BIN_DIR}/agy-sync-lib.sh"
          trap stop_vertex_bridge EXIT
          preflight_ai_toolchain "true"

      - name: Free runner disk space
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"

      - name: Install pinned Rust toolchain with rustfmt and clippy
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        run: |
          set -euo pipefail
          TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' libs/cua-driver/rust/rust-toolchain.toml)
          TOOLCHAIN="${TOOLCHAIN:-stable}"
          echo "Installing Rust toolchain ${TOOLCHAIN} (rustfmt + clippy)..."
          rustup toolchain install "${TOOLCHAIN}" --profile minimal --component rustfmt --component clippy

      - name: Configure Rust sccache
        id: rust_cache
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          pr-save: "true"
          save-always: "true"

      - name: Install Linux build and headless desktop dependencies
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential cmake clang pkg-config
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxi-dev
            libxtst-dev libxrandr-dev libgtk-3-dev
            xvfb xauth x11-utils xdotool dbus-daemon dbus-x11 at-spi2-core
            libglib2.0-bin libatk-adaptor openbox picom python3-gi gir1.2-gtk-3.0
            imagemagick ffmpeg

      - name: Enable mold fast linker
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        run: |
          if timeout 60 sudo apt-get install -y --no-install-recommends mold >/dev/null 2>&1 && command -v mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld
            sudo ln -sf "$(command -v mold)" /usr/bin/ld
            echo "Enabled mold fast linker: $(ld --version | head -n 1)"
          elif command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/local/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            echo "Enabled lld fast linker: $(ld --version | head -n 1)"
          else
            echo "Keeping system default linker: $(ld --version | head -n 1)"
          fi

      - name: Closed-loop conflict resolution, 5-layer test verification, AI self-healing, and publish
        if: contains(fromJSON('["merged_cleanly", "conflict", "heal_existing_pr"]'), steps.merge_attempt.outputs.status)
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_CLI_DISABLE_AUTO_UPDATE: "true"
          AGY_EDIT_SCOPE: "libs"
          AUTO_MERGE_INPUT: ${{ inputs.auto_merge_conflict_resolution }}
          AUTO_MERGE_VAR: ${{ vars.AUTO_MERGE_CONFLICTS }}
          MERGE_STATUS: ${{ steps.merge_attempt.outputs.status }}
          UPSTREAM_SHORT: ${{ steps.merge_attempt.outputs.upstream_short }}
          UPSTREAM_SHA: ${{ steps.merge_attempt.outputs.upstream_sha }}
          TARGET_SHA: ${{ steps.merge_attempt.outputs.target_sha }}
          CONFLICT_FILES: ${{ steps.merge_attempt.outputs.conflict_files }}
          EXISTING_PR_NUM: ${{ steps.merge_attempt.outputs.existing_pr_num }}
          EXISTING_PR_REF: ${{ steps.merge_attempt.outputs.existing_pr_ref }}
          EXISTING_PR_URL: ${{ steps.merge_attempt.outputs.existing_pr_url }}
          EXISTING_PR_DRAFT: ${{ steps.merge_attempt.outputs.existing_pr_draft }}
        run: |
          set -euo pipefail

          # shellcheck source=/dev/null
          source "${SYNC_BIN_DIR}/agy-sync-lib.sh"
          trap stop_vertex_bridge EXIT

          MAX_REPAIR_ROUNDS=5
          SOFT_DEADLINE_EPOCH=$(( $(date +%s) + 76 * 60 ))
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          AI_LOG_SECTIONS=""
          PREFLIGHT_DONE="false"
          if [[ "${MERGE_STATUS}" == "conflict" || "${MERGE_STATUS}" == "heal_existing_pr" ]]; then
            PREFLIGHT_DONE="true"
          fi

          post_commit_status() {
            local sha="$1"
            local state="$2"
            local desc="$3"
            jq -n \
              --arg state "${state}" \
              --arg target_url "${RUN_URL}" \
              --arg description "${desc:0:138}" \
              --arg context "${VERIFY_STATUS_CONTEXT}" \
              '{state: $state, target_url: $target_url, description: $description, context: $context}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" --input - >/dev/null || true
          }

          upsert_pr_verify_comment() {
            local pr_num="$1"
            local extra_notes="${2:-}"
            local include_failure="${3:-false}"
            local marker="<!-- cua-fork-verify-report -->"
            {
              echo "${marker}"
              if [[ -n "${extra_notes}" ]]; then
                echo "### 🛠️ 自动测试自愈记录"
                printf '%s\n\n' "${extra_notes}"
              fi
              if [[ -f /tmp/verify_report.md ]]; then
                cat /tmp/verify_report.md
              fi
              if [[ "${include_failure}" == "true" && -s /tmp/verify_failure.log ]]; then
                echo ""
                echo "<details><summary>展开查看剩余待修复错误摘要</summary>"
                echo ""
                echo "\`\`\`text"
                head -n 160 /tmp/verify_failure.log
                echo "\`\`\`"
                echo "</details>"
              fi
              echo ""
              echo "🔗 [查看完整 Actions 运行日志](${RUN_URL})"
            } > /tmp/pr_verify_comment.md

            local existing_cid
            existing_cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/comments?per_page=50" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)
            if [[ -n "${existing_cid}" ]]; then
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_cid}" --input - >/dev/null || true
            else
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/comments" --input - >/dev/null || true
            fi
          }

          close_superseded_sync_prs() {
            local keep_branch="$1"
            local replacement_desc="$2"
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=50" \
              --jq ".[] | select((.head.ref | startswith(\"auto-sync/\")) and (.head.ref != \"${keep_branch}\")) | \"\(.number) \(.head.ref)\"" \
              | while read -r old_num old_ref; do
                  if [[ -n "${old_num}" ]]; then
                    jq -n --arg body "🔄 已有更新的同步结果取代此分支（${replacement_desc}），自动关闭旧同步 PR 并清理分支 \`${old_ref}\`。" \
                      '{body: $body}' \
                      | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${old_num}/comments" --input - >/dev/null || true
                    printf '{"state":"closed"}' \
                      | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${old_num}" --input - >/dev/null || true
                    git push origin --delete "${old_ref}" >/dev/null 2>&1 || true
                  fi
                done || true
          }

          close_stale_alert_issues() {
            local msg="$1"
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
              --jq '.[] | select(.title | startswith("⚠️ 自动同步")) | .number' \
              | while IFS= read -r inum; do
                  if [[ -n "$inum" ]]; then
                    jq -n --arg body "✅ 最新自动同步闭环已完成修复并通过全部 5 层双向回归测试（${msg}），自动关闭此告警。" '{body: $body}' \
                      | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${inum}/comments" --input - >/dev/null || true
                    printf '{"state":"closed"}' \
                      | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${inum}" --input - >/dev/null || true
                  fi
                done || true
          }

          notify_failure() {
            local reason="$1"
            local record_exhausted="${2:-true}"
            local checkpoint_sha="${3:-}"
            local checkpoint_pr_url="${4:-}"
            local title="⚠️ 自动同步冲突或测试未通过需人工检查"

            local existing_json existing_num prior_markers
            existing_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" \
              --jq '[.[] | select(.title | startswith("⚠️ 自动同步"))][0] // empty' 2>/dev/null || true)
            existing_num=""
            prior_markers=""
            if [[ -n "${existing_json}" ]]; then
              existing_num=$(jq -r '.number // empty' <<<"${existing_json}")
              prior_markers=$(jq -r '.body // ""' <<<"${existing_json}" | grep -Eo '<!-- cua-sync-exhausted: [^>]+ -->' || true)
            fi

            {
              echo "将上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHORT}\` 同步到 \`${TARGET_BRANCH}\` 时，自动闭环（最多 ${MAX_REPAIR_ROUNDS} 轮编译/测试自愈，仅使用 Gemini 4 Argon + Gemini 3.8 Flash）未能完全修复所有问题，**已拦截直接合入以保护目标分支**。"
              if [[ -n "${checkpoint_pr_url}" ]]; then
                echo ""
                echo "👉 **已保存自动融合与修复检查点 Draft PR**：${checkpoint_pr_url}"
                echo "> 可直接在该 Draft PR 分支上补充修改，或手动触发 \`Sync Upstream Main\` (\`workflow_dispatch\`) 从此检查点断点续修（定时任务不会对同一已耗尽状态重复空烧配额）。"
              fi
              echo ""
              echo "**失败原因**："
              echo "\`\`\`"
              printf '%s\n' "${reason}"
              echo "\`\`\`"
              if [[ -n "${CONFLICT_FILES:-}" ]]; then
                echo ""
                echo "**Git 冲突文件**："
                echo "\`\`\`"
                printf '%s\n' "${CONFLICT_FILES}"
                echo "\`\`\`"
              fi
              if [[ -s /tmp/verify_failure.log ]]; then
                echo ""
                echo "**最后一次编译 / 测试错误摘要**："
                echo "\`\`\`text"
                head -n 180 /tmp/verify_failure.log
                echo "\`\`\`"
              fi
              echo ""
              echo "**完整运行日志**：${RUN_URL}"
              echo ""
              {
                if [[ -n "${prior_markers}" ]]; then
                  printf '%s\n' "${prior_markers}"
                fi
                if [[ "${record_exhausted}" == "true" ]]; then
                  if [[ -n "${TARGET_SHA:-}" ]]; then
                    format_sync_exhausted_marker "${UPSTREAM_SHA}" "${TARGET_SHA}"
                    echo ""
                  fi
                  if [[ -n "${checkpoint_sha}" ]]; then
                    format_sync_exhausted_marker "${UPSTREAM_SHA}" "${checkpoint_sha}"
                    echo ""
                  fi
                fi
              } | sort -u
            } > /tmp/sync_issue_body.md

            if [[ -n "${existing_num}" ]]; then
              jq -n --rawfile body /tmp/sync_issue_body.md '{body: $body}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${existing_num}" --input - >/dev/null || true
              echo "Updated alert issue #${existing_num} body & circuit-breaker markers."
              return 0
            fi

            jq -n \
              --arg title "${title}" \
              --rawfile body /tmp/sync_issue_body.md \
              '{title: $title, body: $body}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" --input - >/dev/null || true
          }

          sanitize_and_format_workspace() {
            prune_upstream_workflows
            git clean -fd -- ':!libs' ':!.github' >/dev/null 2>&1 || true
            reconcile_rust_lockfiles \
              "libs/cua-driver/rust/Cargo.toml" \
              "libs/cua-spacesd/Cargo.toml" || true
            (cd libs/cua-driver/rust && cargo fmt --all) || true
          }

          publish_checkpoint_and_notify() {
            local reason="$1"

            # Discard any half-edited uncommitted working tree changes while keeping committed progress.
            git checkout -- . >/dev/null 2>&1 || true
            git clean -fd -- libs/ >/dev/null 2>&1 || true

            if [[ -f .git/MERGE_HEAD ]] || has_remaining_conflict_markers; then
              notify_failure "${reason}" "true" "" ""
              return 0
            fi

            # If the final round regressed into a compile error while an earlier round compiled cleanly,
            # roll back to BEST_COMPILING_SHA so the checkpoint Draft PR always compiles!
            if [[ "${LAST_ROUND_KIND:-}" == "compile" && -n "${BEST_COMPILING_SHA:-}" ]]; then
              echo "⏪ Restoring best compiling checkpoint ${BEST_COMPILING_SHA:0:12} before saving Draft PR..."
              git reset --hard "${BEST_COMPILING_SHA}"
            fi

            local final_sha
            final_sha=$(git rev-parse HEAD)

            if [[ "${MERGE_STATUS}" == "heal_existing_pr" ]]; then
              git push origin "HEAD:refs/heads/${EXISTING_PR_REF}" || true
              post_commit_status "${final_sha}" "failure" "Auto-heal paused (${REPAIR_ROUND} round(s)); manual check or re-run"
              upsert_pr_verify_comment "${EXISTING_PR_NUM}" "${AI_LOG_SECTIONS}" "true"
              notify_failure "${reason}" "true" "${final_sha}" "${EXISTING_PR_URL}"
              return 0
            fi

            local pr_branch draft_title draft_url
            pr_branch="auto-sync/${UPSTREAM_SHORT}-$(date -u +%Y%m%d-%H%M)"
            draft_title="chore(sync): [WIP/需人工检查] 合并上游 main (${UPSTREAM_SHORT}) 自动修复检查点"

            if git push -u origin "HEAD:refs/heads/${pr_branch}"; then
              post_commit_status "${final_sha}" "failure" "Checkpoint saved (${REPAIR_ROUND} round(s)); manual check or re-run"
              {
                echo "## 🚧 自动同步与自愈检查点（需人工介入或断点续修）"
                echo ""
                echo "上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\` 的合并冲突已清除并保存至此检查点分支，但经过 **${REPAIR_ROUND}** 轮双模型（\`Gemini 4 Argon\` + \`Gemini 3.8 Flash\`）自愈后仍有部分测试未通过："
                echo ""
                echo "- **原因**：${reason}"
                echo "- **如何继续**：可直接在此分支补充修复提交（会自动触发 5 层验证），或手动触发 \`Sync Upstream Main\` 工作流从此检查点继续自动修复。"
                if [[ -n "${AI_LOG_SECTIONS}" ]]; then
                  echo ""
                  echo "### AI 融合与自愈记录"
                  printf '%s\n' "${AI_LOG_SECTIONS}"
                fi
                if [[ -f /tmp/verify_report.md ]]; then
                  echo ""
                  cat /tmp/verify_report.md
                fi
                if [[ -s /tmp/verify_failure.log ]]; then
                  echo ""
                  echo "### 剩余待修复错误摘要"
                  echo "\`\`\`text"
                  head -n 160 /tmp/verify_failure.log
                  echo "\`\`\`"
                fi
                echo ""
                echo "🔗 [查看完整 Actions 运行日志](${RUN_URL})"
              } > /tmp/checkpoint_pr_body.md

              draft_url=$(jq -n \
                --arg title "${draft_title}" \
                --arg head "${pr_branch}" \
                --arg base "${TARGET_BRANCH}" \
                --rawfile body /tmp/checkpoint_pr_body.md \
                '{title: $title, head: $head, base: $base, body: $body, draft: true}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" --input - --jq '.html_url' 2>/dev/null || true)

              if [[ -n "${draft_url}" ]]; then
                echo "Saved checkpoint Draft PR: ${draft_url}"
                close_superseded_sync_prs "${pr_branch}" "检查点 Draft PR：${draft_url}"
              fi
              notify_failure "${reason}" "true" "${final_sha}" "${draft_url}"
            else
              notify_failure "${reason}" "true" "${final_sha}" ""
            fi
          }

          # ====================================================================
          # 阶段 1：若存在 Git 文本冲突，先由 agy (Argon 主力 / 3.8 Flash 协作) 完成代码融合
          # ====================================================================
          if [[ "${MERGE_STATUS}" == "conflict" ]]; then
            {
              echo "当前仓库正处于将 upstream/main (${UPSTREAM_SHORT}) 合并到 ${TARGET_BRANCH} 的合并冲突状态，以下文件存在冲突标记："
              printf '%s\n' "${CONFLICT_FILES}"
              echo ""
              echo "请严格遵循以下职责边界快速完成冲突文件融合："
              echo "1. 直接按冲突标记位置阅读上述冲突文件上下文，必要时用 git log MERGE_HEAD -n 10 -- <冲突文件> 与 git log HEAD -n 10 -- <冲突文件> 查看双方改动意图；"
              echo "2. 同时保留上游最新改进与本分支定制逻辑（Linux Wayland / cua-perception / AT-SPI 按钮回退），清除全部 <<<<<<< / ======= / >>>>>>> 冲突标记并保存文件；"
              echo "3. **绝对禁止**在终端子命令中执行 cargo build / cargo clippy / cargo check / cargo test，也无需手动 git commit（外层流水线会在你返回后立即自动同步 Cargo.lock、执行 cargo fmt、git add/commit 并进入 5 层回归测试闭环）；"
              echo "4. 严禁修改或恢复 .github/workflows/ 下的工作流文件；最后用简明中文说明冲突原因与融合方式。"
            } > /tmp/agy_conflict_prompt.txt

            if ! invoke_agy_with_prompt "$(cat /tmp/agy_conflict_prompt.txt)" "deep" "true" notify_failure; then
              exit 1
            fi

            if has_remaining_conflict_markers; then
              notify_failure "agy 运行结束但工作区仍残留未清除的 Git 冲突标记。" "true"
              exit 1
            fi

            sanitize_and_format_workspace

            if [[ -f .git/MERGE_HEAD ]]; then
              git add -u
              git add -- libs/
              while IFS= read -r cf; do
                if [[ -n "$cf" && -e "$cf" ]]; then
                  git add -- "$cf"
                fi
              done <<< "${CONFLICT_FILES}"
              if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
                git commit -m "Merge branch 'main' (${UPSTREAM_SHORT}) into ${TARGET_BRANCH}"
              fi
            elif ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git ls-files --others --exclude-standard -- libs/)" ]]; then
              git add -u
              git add -- libs/
              git commit --amend --no-edit
            fi

            if [[ -f .git/MERGE_HEAD ]] || [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              notify_failure "agy 运行结束但仍存在未完成提交的合并状态。" "true"
              exit 1
            fi

            AI_LOG_SECTIONS="#### Git 冲突融合说明"$'\n'"${SUMMARY}"
          fi

          # Pre-Round-0 deterministic Cargo.lock reconciliation (handles lockfiles auto-resolved
          # during merge_attempt before rustup/cargo was installed, preventing --locked deadlocks).
          reconcile_rust_lockfiles \
            "libs/cua-driver/rust/Cargo.toml" \
            "libs/cua-spacesd/Cargo.toml"
          if ! git diff --quiet -- '*Cargo.lock' 'Cargo.lock' 2>/dev/null; then
            git add -- '*Cargo.lock' 'Cargo.lock' 2>/dev/null || git add -u
            if [[ "${MERGE_STATUS}" == "heal_existing_pr" ]]; then
              git commit -m "chore(sync): reconcile Cargo.lock with workspace manifests"
            else
              git commit --amend --no-edit
            fi
          fi

          # ====================================================================
          # 阶段 2：5 层确定性验证 + 双模型自适应升级（3.8 Flash 快速修编译 -> Argon 深度攻坚）
          # ====================================================================
          REPAIR_ROUND=0
          VERIFIED_OK="false"
          PREV_FAIL_SIG=""
          LAST_ROUND_KIND=""
          BEST_COMPILING_SHA=""
          CONSECUTIVE_COMPILE_FAILS=0
          SEEN_TREES=" $(git rev-parse 'HEAD^{tree}') "
          rm -f /tmp/verify_last_failure.env /tmp/verify_last_runtime_target.env

          while true; do
            echo ""
            echo ">>> Executing 5-layer bidirectional verification (repair round ${REPAIR_ROUND}/${MAX_REPAIR_ROUNDS})..."
            if bash "${SYNC_BIN_DIR}/verify-fork-driver.sh"; then
              VERIFIED_OK="true"
              break
            fi

            FAILED_KIND="runtime_test"
            FAILED_SIGNATURE=""
            if [[ -f /tmp/verify_last_failure.env ]]; then
              # shellcheck disable=SC1091
              source /tmp/verify_last_failure.env
            fi
            LAST_ROUND_KIND="${FAILED_KIND}"
            if [[ "${FAILED_KIND}" == "runtime_test" ]]; then
              BEST_COMPILING_SHA=$(git rev-parse HEAD)
            fi

            if [[ "${REPAIR_ROUND}" -ge "${MAX_REPAIR_ROUNDS}" ]]; then
              echo "❌ Reached maximum auto-repair rounds (${MAX_REPAIR_ROUNDS}) without passing all 5 test layers." >&2
              break
            fi

            NOW_EPOCH=$(date +%s)
            REMAINING_SECS=$(( SOFT_DEADLINE_EPOCH - NOW_EPOCH ))
            if [[ "${REMAINING_SECS}" -lt 660 ]]; then
              echo "⏱️ Remaining soft budget (${REMAINING_SECS}s) is under 11m; saving checkpoint and stopping cleanly." >&2
              publish_checkpoint_and_notify "接近作业超时安全水位（已完成 ${REPAIR_ROUND} 轮自愈，剩余 ${REMAINING_SECS}s），已自动保存检查点并收敛退出。"
              exit 1
            fi

            if [[ "${PREFLIGHT_DONE}" != "true" ]]; then
              if ! preflight_ai_toolchain "true"; then
                # Transient preflight error: do NOT mark SHA pair exhausted so next cron retries!
                notify_failure "AI 工具链或双模型（Gemini 4 Argon / Gemini 3.8 Flash）预检未通过（将在下次调度自动重试）。" "false"
                exit 1
              fi
              PREFLIGHT_DONE="true"
            fi

            REPAIR_ROUND=$((REPAIR_ROUND + 1))

            if [[ "${FAILED_KIND}" == "compile" ]]; then
              CONSECUTIVE_COMPILE_FAILS=$((CONSECUTIVE_COMPILE_FAILS + 1))
            else
              CONSECUTIVE_COMPILE_FAILS=0
            fi

            # 首轮简单编译/Clippy 报错优先用 3.8 Flash 快速点修；若连续编译失败、同一签名复现、或属于运行时测试失败，则自动升级至 Argon 主导！
            HEAL_TIER="deep"
            if [[ "${FAILED_KIND}" == "compile" && "${CONSECUTIVE_COMPILE_FAILS}" -eq 1 && "${FAILED_SIGNATURE}" != "${PREV_FAIL_SIG}" ]]; then
              HEAL_TIER="fast"
            fi
            PREV_FAIL_SIG="${FAILED_SIGNATURE}"

            echo "⚠️ Verification failed (kind=${FAILED_KIND}, sig=${FAILED_SIGNATURE:-none}, tier=${HEAL_TIER})! Starting AI self-healing round ${REPAIR_ROUND}/${MAX_REPAIR_ROUNDS}..."

            FAILURE_DIGEST=$(cat /tmp/verify_failure.log)
            {
              echo "当前分支在同步上游 main (${UPSTREAM_SHORT}) 后运行 5 层双向编译与回归测试未通过（第 ${REPAIR_ROUND}/${MAX_REPAIR_ROUNDS} 轮自动修复）。"
              echo ""
              echo "以下是外层流水线去重提取的精确编译 / Clippy / 测试报错摘要："
              echo "================================================================================"
              printf '%s\n' "${FAILURE_DIGEST}"
              echo "================================================================================"
              echo ""
              echo "请严格遵循以下职责边界快速完成源码修复："
              echo "1. 直接根据报错行号按行区间精准阅读仓库内的对应源码文件与 git log 上下文（遇到数千行的大文件时务必只按行号区间或符号搜索定位，不要逐段通读全文；不要读取 /tmp 外部目录，也**绝对禁止**在终端子命令里执行 cargo build / cargo clippy / cargo check / cargo test —— 外层流水线会在你返回后立即自动同步 Cargo.lock、执行 cargo fmt --all 并按定向优先顺序极速复测，若还有深层问题会自动进入下一轮反馈给你）；"
              echo "2. 结合上下文同时保护上游最新改动与本分支定制能力（Wayland 窗口裁剪/拖拽/焦点、浏览器现有 Profile CDP 绑定、cua-perception 无损与批处理推理、AT-SPI 按钮回退），做最小、地道的等价代码修复；"
              echo "3. 【红线约束】严禁删除、注释或 #[ignore] 任何测试用例，严禁弱化测试断言，严禁添加文件级 #![allow(...)] 掩盖告警，严禁修改 .github/workflows/；"
              echo "4. 完成文件编辑保存即可（外层会自动执行 cargo fmt 与 git commit），最后用简明中文总结本轮修复的问题根因与改动点。"
            } > /tmp/agy_heal_prompt.txt

            if ! invoke_agy_with_prompt "$(cat /tmp/agy_heal_prompt.txt)" "${HEAL_TIER}" "true"; then
              publish_checkpoint_and_notify "第 ${REPAIR_ROUND} 轮 agy 双模型调用（Gemini 4 Argon + Gemini 3.8 Flash）未完成有效修复。"
              exit 1
            fi
            sanitize_and_format_workspace

            if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git ls-files --others --exclude-standard -- libs/)" ]]; then
              git add -u
              git add -- libs/
              if [[ "${MERGE_STATUS}" == "heal_existing_pr" ]]; then
                git commit -m "fix(sync): auto-heal compile/clippy/test regressions (round ${REPAIR_ROUND})"
              else
                git commit --amend --no-edit
              fi
            fi

            NEW_TREE=$(git rev-parse 'HEAD^{tree}')
            if [[ "${SEEN_TREES}" == *" ${NEW_TREE} "* ]]; then
              echo "⚠️ Workspace tree ${NEW_TREE:0:12} already appeared in an earlier round; forcing escalation on next attempt."
              CONSECUTIVE_COMPILE_FAILS=2
            else
              SEEN_TREES="${SEEN_TREES}${NEW_TREE} "
            fi

            if [[ -n "${AI_LOG_SECTIONS}" ]]; then
              AI_LOG_SECTIONS="${AI_LOG_SECTIONS}"$'\n\n'"#### 自动编译/测试自愈（第 ${REPAIR_ROUND} 轮 · ${HEAL_TIER}）"$'\n'"${SUMMARY}"
            else
              AI_LOG_SECTIONS="#### 自动编译/测试自愈（第 ${REPAIR_ROUND} 轮 · ${HEAL_TIER}）"$'\n'"${SUMMARY}"
            fi
          done

          if [[ -f /tmp/verify_report.md ]]; then
            cat /tmp/verify_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${VERIFIED_OK}" != "true" ]]; then
            publish_checkpoint_and_notify "经过 ${MAX_REPAIR_ROUNDS} 轮 AI 自动修复（Gemini 4 Argon + Gemini 3.8 Flash）后，5 层双向编译与回归测试仍未完全通过。"
            exit 1
          fi

          # ====================================================================
          # 阶段 3：全部 5 层测试 100% 通过！按状态自动发布 / 更新 PR / 清理过期旧 PR 与告警
          # ====================================================================
          FINAL_SHA=$(git rev-parse HEAD)

          if [[ "${MERGE_STATUS}" == "heal_existing_pr" ]]; then
            git push origin "HEAD:refs/heads/${EXISTING_PR_REF}"
            post_commit_status "${FINAL_SHA}" "success" "Auto-healed (${REPAIR_ROUND} round(s)) & all 5 test layers passed"
            if [[ "${EXISTING_PR_DRAFT:-false}" == "true" ]]; then
              gh pr ready "${EXISTING_PR_NUM}" >/dev/null 2>&1 || true
              CLEAN_TITLE="chore(sync): 合并上游 main (${UPSTREAM_SHORT}) 并自动完成自愈与测试验证"
              jq -n --arg title "${CLEAN_TITLE}" '{title: $title}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING_PR_NUM}" --input - >/dev/null || true
            fi
            upsert_pr_verify_comment "${EXISTING_PR_NUM}" "${AI_LOG_SECTIONS}" "false"
            close_superseded_sync_prs "${EXISTING_PR_REF}" "PR #${EXISTING_PR_NUM}"
            close_stale_alert_issues "自动修复并验证通过现有 PR #${EXISTING_PR_NUM}：${EXISTING_PR_URL}"
            echo "Successfully healed and verified existing PR #${EXISTING_PR_NUM} (${EXISTING_PR_URL})!"
            exit 0
          fi

          if [[ "${MERGE_STATUS}" == "merged_cleanly" && "${REPAIR_ROUND}" -eq 0 ]]; then
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            post_commit_status "${FINAL_SHA}" "success" "Clean merge verified: all 5 compile, unit, Wayland & GTK3 AT-SPI layers passed"
            close_superseded_sync_prs "__merged_to_target__" "已直接合入 \`${TARGET_BRANCH}\`"
            close_stale_alert_issues "已无冲突合入 \`${TARGET_BRANCH}\` 并一次通过全部 5 层测试"
            echo "Clean merge passed all 5 layers on first run and was pushed to ${TARGET_BRANCH}!"
            exit 0
          fi

          if [[ "${MERGE_STATUS}" == "merged_cleanly" ]]; then
            PR_TITLE="chore(sync): 合并上游 main (${UPSTREAM_SHORT}) 并自动修复编译/测试兼容问题"
            PR_INTRO="上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\` 在 Git 文本层面无冲突，但 **5 层双向测试拦截到了跨侧编译/Clippy/功能兼容问题**，已由 **Antigravity CLI (\`agy\`: Gemini 4 Argon + Gemini 3.8 Flash)** 自动完成自愈修复并通过全部测试："
          else
            PR_TITLE="chore(sync): 合并上游 main (${UPSTREAM_SHORT}) 并自动解决冲突与测试验证"
            PR_INTRO="上游 \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\` 合并到 \`${TARGET_BRANCH}\` 时出现冲突，已由 **Antigravity CLI (\`agy\`: Gemini 4 Argon + Gemini 3.8 Flash)** 自动完成代码融合与自愈修复，并通过全部 5 层双向回归测试："
          fi

          RESULT_REF=""
          if [[ "${AUTO_MERGE_INPUT}" == "true" || "${AUTO_MERGE_VAR}" == "true" ]]; then
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            post_commit_status "${FINAL_SHA}" "success" "All 5 layers passed after automated conflict/test resolution"
            close_superseded_sync_prs "__merged_to_target__" "已自动合入 \`${TARGET_BRANCH}\`"
            echo "Auto-merged verified changes directly into ${TARGET_BRANCH}!"
            RESULT_REF="已通过全部 5 层测试并直接自动合并至 \`${TARGET_BRANCH}\`"
          else
            PR_BRANCH="auto-sync/${UPSTREAM_SHORT}-$(date -u +%Y%m%d-%H%M)"
            git push -u origin "HEAD:refs/heads/${PR_BRANCH}"
            post_commit_status "${FINAL_SHA}" "success" "All 5 layers passed (fmt + clippy + unit + Wayland portal + GTK3 AT-SPI)"

            {
              echo "## 🤖 自动同步、自愈修复与双向回归测试报告"
              echo ""
              echo "${PR_INTRO}"
              if [[ -n "${CONFLICT_FILES:-}" ]]; then
                echo ""
                echo "### Git 冲突文件列表"
                echo "\`\`\`"
                echo "${CONFLICT_FILES}"
                echo "\`\`\`"
              fi
              echo ""
              echo "### AI 融合与自愈说明"
              printf '%s\n' "${AI_LOG_SECTIONS}"
              echo ""
              cat /tmp/verify_report.md
              echo ""
              echo "---"
              echo "> 上方 5 层双向编译与回归测试已 **100% 通过 ✅**，确认代码改动无误后点击 **Merge pull request** 即可合入 \`${TARGET_BRANCH}\`。"
              echo "> *(若后续希望在 5 层测试全绿时跳过人工确认直接合入，可将仓库 Variables 中的 \`AUTO_MERGE_CONFLICTS\` 设为 \`true\`。)*"
            } > /tmp/pr_body.md

            PR_URL=$(jq -n \
              --arg title "${PR_TITLE}" \
              --arg head "${PR_BRANCH}" \
              --arg base "${TARGET_BRANCH}" \
              --rawfile body /tmp/pr_body.md \
              '{title: $title, head: $head, base: $base, body: $body}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" --input - --jq '.html_url')
            echo "Created verified sync PR: ${PR_URL}"
            close_superseded_sync_prs "${PR_BRANCH}" "${PR_URL}"
            RESULT_REF="已创建通过全部 5 层测试的同步 PR：${PR_URL}"
          fi

          close_stale_alert_issues "${RESULT_REF}"

      - name: Save Rust sccache
        if: always() && steps.rust_cache.outputs.save == 'true'
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          dir: ${{ steps.rust_cache.outputs.dir }}
          exact-hit: ${{ steps.rust_cache.outputs.exact-hit }}

  verify:
    name: Bidirectional Driver & Perception Regression Suite
    if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.verify_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout base branch for verification runner
        uses: actions/checkout@v5
        with:
          ref: feat/wayland-with-perception-opt
          fetch-depth: 0

      - name: Checkout target PR or commit and mark status pending
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          VERIFY_REF_INPUT: ${{ inputs.verify_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=.github/workflows/agy-sync-lib.sh
          source .github/workflows/agy-sync-lib.sh
          stage_sync_scripts_to_dir "${SYNC_BIN_DIR}"

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PR_NUMBER=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${PR_HEAD_SHA}"
            git checkout --detach "${PR_HEAD_SHA}"
            TESTED_SHA=$(git rev-parse HEAD)
            PR_NUMBER="${PR_NUMBER_EVENT}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            git fetch origin "${PUSH_SHA}"
            git checkout --detach "${PUSH_SHA}"
            TESTED_SHA=$(git rev-parse HEAD)
          else
            git fetch origin "${VERIFY_REF_INPUT}" || true
            if git rev-parse --verify --quiet "origin/${VERIFY_REF_INPUT}^{commit}" >/dev/null; then
              git checkout --detach "origin/${VERIFY_REF_INPUT}"
            else
              git checkout --detach "${VERIFY_REF_INPUT}"
            fi
            TESTED_SHA=$(git rev-parse HEAD)
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=50" \
              --jq ".[] | select(.head.sha == \"${TESTED_SHA}\" or .head.ref == \"${VERIFY_REF_INPUT}\") | .number" \
              | head -n 1 || true)
          fi

          echo "tested_sha=${TESTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Verifying exact commit ${TESTED_SHA} (PR: ${PR_NUMBER:-none})"

          jq -n \
            --arg state "pending" \
            --arg target_url "${RUN_URL}" \
            --arg description "Running 5-layer compile, clippy, unit, Wayland & GTK3 AT-SPI suite..." \
            --arg context "${VERIFY_STATUS_CONTEXT}" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" --input - >/dev/null || true

      - name: Free runner disk space
        uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"

      - name: Install pinned Rust toolchain with rustfmt and clippy
        run: |
          set -euo pipefail
          TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' libs/cua-driver/rust/rust-toolchain.toml)
          TOOLCHAIN="${TOOLCHAIN:-stable}"
          rustup toolchain install "${TOOLCHAIN}" --profile minimal --component rustfmt --component clippy

      - name: Configure Rust sccache
        id: rust_cache
        uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          pr-save: "true"
          save-always: "true"

      - name: Install Linux build and headless desktop dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential cmake clang pkg-config
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxi-dev
            libxtst-dev libxrandr-dev libgtk-3-dev
            xvfb xauth x11-utils xdotool dbus-daemon dbus-x11 at-spi2-core
            libglib2.0-bin libatk-adaptor openbox picom python3-gi gir1.2-gtk-3.0
            imagemagick ffmpeg

      - name: Enable mold fast linker
        run: |
          if timeout 60 sudo apt-get install -y --no-install-recommends mold >/dev/null 2>&1 && command -v mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld
            sudo ln -sf "$(command -v mold)" /usr/bin/ld
            echo "Enabled mold fast linker: $(ld --version | head -n 1)"
          elif command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/local/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            echo "Enabled lld fast linker: $(ld --version | head -n 1)"
          else
            echo "Keeping system default linker: $(ld --version | head -n 1)"
          fi

      - name: Run 5-layer bidirectional verification and publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ steps.target.outputs.tested_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          set +e
          bash "${SYNC_BIN_DIR}/verify-fork-driver.sh"
          VERIFY_RC=$?
          set -e

          if [[ -f /tmp/verify_report.md ]]; then
            cat /tmp/verify_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${VERIFY_RC}" -eq 0 ]]; then
            STATE="success"
            DESC="All 5 layers passed (fmt + clippy + unit + Wayland portal + GTK3 AT-SPI)"
          else
            STATE="failure"
            DESC="Bidirectional regression suite failed (exit ${VERIFY_RC})"
          fi

          jq -n \
            --arg state "${STATE}" \
            --arg target_url "${RUN_URL}" \
            --arg description "${DESC}" \
            --arg context "${VERIFY_STATUS_CONTEXT}" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" --input - >/dev/null || true

          if [[ -n "${PR_NUMBER}" && -f /tmp/verify_report.md ]]; then
            MARKER="<!-- cua-fork-verify-report -->"
            {
              echo "${MARKER}"
              cat /tmp/verify_report.md
              if [[ "${VERIFY_RC}" -ne 0 && -s /tmp/verify_failure.log ]]; then
                echo ""
                echo "<details><summary>展开查看错误日志摘要</summary>"
                echo ""
                echo "\`\`\`text"
                head -n 160 /tmp/verify_failure.log
                echo "\`\`\`"
                echo "</details>"
              fi
              echo ""
              echo "🔗 [查看完整 Actions 运行日志](${RUN_URL})"
            } > /tmp/pr_verify_comment.md

            EXISTING_COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=50" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
            if [[ -n "${EXISTING_COMMENT_ID}" ]]; then
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" --input - >/dev/null || true
            else
              jq -n --rawfile body /tmp/pr_verify_comment.md '{body: $body}' \
                | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null || true
            fi
          fi

          exit "${VERIFY_RC}"

      - name: Save Rust sccache
        if: always() && steps.rust_cache.outputs.save == 'true'
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          dir: ${{ steps.rust_cache.outputs.dir }}
          exact-hit: ${{ steps.rust_cache.outputs.exact-hit }}
